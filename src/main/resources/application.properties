spring.application.name=onebus

# Geocoding Configuration
# Provider selection: nominatim (default) or google
geocoding.provider=nominatim
geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.email=admin@onebus.com

# For Google Places (future implementation)
# geocoding.provider=google
# geocoding.google.api-key=YOUR_API_KEY_HERE

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}&connectTimeout=30&socketTimeout=30&tcpKeepAlive=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration (Connection Pool)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server Configuration
server.port=8080

logging.level.com.backend.onebus=DEBUG
logging.level.root=INFO
logging.file.name=server.log

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packages-to-scan=com.backend.onebus.controller

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.location=${java.io.tmpdir}

# Custom application properties
app.upload.dir=media
# Tracking Persistence (Set to false to save DB costs, data will stay in Redis/Memory)
app.tracking.persistence.enabled=false

# Jackson Configuration (for LocalDateTime serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
